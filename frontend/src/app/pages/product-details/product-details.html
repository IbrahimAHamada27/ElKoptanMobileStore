<div class="product-details-container" *ngIf="product() as p; else noProduct">
  <div class="product-images">
    <div class="main-image-container">
      <img [src]="p.image" [alt]="p.name" class="main-image" loading="eager" fetchpriority="high" style="width: 100%; max-width: 400px; border-radius: 12px; object-fit: contain;" />
    </div>
  </div>
  
  <div class="product-info">
    <h1 class="product-title">{{ p.name }}</h1>
    <div class="product-price">
      <span class="current-price">{{ p.discountPrice || p.price }} جنيه</span>
      <span class="old-price" *ngIf="p.discountPrice">{{ p.price }} جنيه</span>
    </div>
    
    <div class="product-description" *ngIf="p.desc">
      <h3>الوصف:</h3>
      <p style="white-space: pre-wrap; line-height: 1.6; color: var(--text-light);">{{ p.desc }}</p>
    </div>
    
    <div class="purchase-actions">
      <ng-container *ngIf="cartService.getQuantity(p.id) === 0; else inCart">
        <button class="btn-primary add-to-cart-btn-large" (click)="cartService.addToCart(p)">أضف إلى السلة</button>
      </ng-container>
      <ng-template #inCart>
        <div class="quantity-control-large">
          <button class="qty-btn" (click)="cartService.decreaseQuantity(p.id)">-</button>
          <span class="qty-display">{{ cartService.getQuantity(p.id) }}</span>
          <button class="qty-btn" (click)="cartService.addToCart(p)">+</button>
        </div>
        <button class="btn-secondary add-to-cart-btn-large" routerLink="/cart">الذهاب للسلة</button>
      </ng-template>
    </div>
  </div>
</div>

<ng-template #noProduct>
  <div class="product-details-container text-center" style="padding: 60px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 300px; width: 100%;">
    <div *ngIf="isLoading()" style="font-size: 1.2rem; color: #1a237e;">
      ⏳ جاري تحميل تفاصيل المنتج...
    </div>
    <div *ngIf="!isLoading()">
      <div style="font-size: 3rem; margin-bottom: 15px;">🔍</div>
      <h2 style="color: #1a237e; margin-bottom: 10px;">عفواً، هذا المنتج غير موجود أو تم حذفه</h2>
      <p style="color: #64748b; margin-bottom: 20px;">يمكنك العودة للصفحة الرئيسية وتصفح أحدث الهواتف والإكسسوارات المتاحة.</p>
      <a routerLink="/" class="btn-primary" style="text-decoration: none; display: inline-block; padding: 12px 24px;">العودة للرئيسية</a>
    </div>
  </div>
</ng-template>
