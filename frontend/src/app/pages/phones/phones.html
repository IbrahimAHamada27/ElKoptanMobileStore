<div class="phones-container">
  <h1 class="page-title">هواتف وموبايلات للبيع في مدينة العبور</h1>
  <div class="products-grid">
    <div class="product-card" *ngFor="let phone of paginatedPhones(); let i = index">
      <div class="product-image-container">
        <a [routerLink]="['/product', phone.id]" style="cursor: pointer;">
          <img [src]="phone.image" [alt]="phone.name + ' - شراء موبايل في العبور'" class="product-image" [attr.loading]="i < 4 ? 'eager' : 'lazy'" />
        </a>
        <div class="cart-controls">
          <button class="add-to-cart-btn" *ngIf="cartService.getQuantity(phone.id) === 0" (click)="cartService.addToCart(phone)" [attr.aria-label]="'إضافة ' + phone.name + ' إلى السلة'">
            <span>+</span>
          </button>
          <div class="quantity-control-pill" *ngIf="cartService.getQuantity(phone.id) > 0">
            <button class="qty-btn" (click)="cartService.decreaseQuantity(phone.id)">-</button>
            <span class="qty-display">{{ cartService.getQuantity(phone.id) }}</span>
            <button class="qty-btn" (click)="cartService.addToCart(phone)">+</button>
          </div>
        </div>
      </div>
      <div class="product-details">
        <h2 class="product-name" style="font-size: 1.1rem; margin: 0 0 8px 0;"><a [routerLink]="['/product', phone.id]">{{ phone.name }}</a></h2>
        <div class="price-and-badges">
          <div class="product-price">
            <span class="current-price">{{ phone.discountPrice || phone.price }} جنيه</span>
            <span class="old-price" *ngIf="phone.discountPrice">{{ phone.price }} جنيه</span>
          </div>
          <!-- Badges -->
          <div class="badges-container">
            <div class="badge discount-badge" *ngIf="phone.discountPrice">
              -{{ getDiscountPercentage(phone.price, phone.discountPrice) }}%
            </div>
            <div class="badge best-seller-badge" *ngIf="phone.isBestSeller">
              الأكثر مبيعاً
            </div>
            <div class="badge new-badge" *ngIf="phone.isNew">
              جديد
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <app-pagination 
    [currentPage]="currentPage()" 
    [totalItems]="allPhones().length" 
    [pageSize]="pageSize" 
    (pageChange)="onPageChange($event)">
  </app-pagination>
</div>
